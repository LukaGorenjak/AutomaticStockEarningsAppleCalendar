name: SEOnet Financial Calendar Watcher

on:
  schedule:
    # Runs once daily at 07:15 UTC
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch-seonet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Run SEOnet watcher
        id: seonet
        run: |
          set +e
          python -m earnings_cal.seonet
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open GitHub issues for new financial calendar reports
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          reports=(reports/*.md)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No new SEOnet reports generated."
            exit 0
          fi

          # Fetch existing open and closed issues to deduplicate by announcement ID
          existing_bodies=$(gh api "repos/${{ github.repository }}/issues?state=all&per_page=100" --paginate --jq '.[].body // ""')

          for report in "${reports[@]}"; do
            base=$(basename "$report" .md)
            ticker="${base%%_*}"
            doc_id="${base#*_}"

            if printf '%s\n' "$existing_bodies" | grep -qF "seonet-doc-id: ${doc_id}"; then
              echo "Issue already exists (open or closed) for announcement ${doc_id}; skipping."
              continue
            fi

            echo "Opening issue for ${ticker} (announcement ${doc_id})..."
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "New financial calendar: ${ticker}" \
              --body-file "$report"
          done

      - name: Commit state/seonet_seen.json if changed
        if: always()
        run: |
          git add state/seonet_seen.json
          if git diff --cached --quiet; then
            echo "No changes to state/seonet_seen.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update seonet seen announcements state"
            git push
          fi

      - name: Fail if SEOnet watcher reported errors
        if: steps.seonet.outputs.exit_code != '0'
        run: |
          echo "SEOnet watcher exited with code ${{ steps.seonet.outputs.exit_code }}"
          exit 1
