name: Scrape LJSE Weekly & Sync Watchlist

on:
  schedule:
    # Runs once a week every Monday at 06:30 UTC
    - cron: "30 6 * * 1"
  push:
    branches:
      - main
    paths:
      - "tickers.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-ljse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Scrape LJSE SEOnet & rebuild earnings calendar (.ics)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONPATH: src
        run: python -m earnings_cal --scrape-ljse

      - name: Commit state/ljse_cache.json and docs/earnings.ics if changed
        run: |
          git add state/ljse_cache.json docs/earnings.ics
          if git diff --cached --quiet; then
            echo "No changes to LJSE cache or docs/earnings.ics"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update LJSE cache and earnings calendar"
            git push
          fi
