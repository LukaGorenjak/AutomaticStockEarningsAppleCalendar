name: Update Market Calendars

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - "tickers.yaml"
      - "ljse_events.yaml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-calendars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Build all registered market calendars (.ics), docs/index.html, docs/status.json, and change log
        id: build
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONPATH: src
        run: |
          set +e
          python -m earnings_cal \
            --commit-msg-file "${{ runner.temp }}/commit_msg.txt" \
            --alert-file "${{ runner.temp }}/calendar_alert.json"
          CAL_EXIT=$?
          echo "cal_exit=$CAL_EXIT" >> "$GITHUB_OUTPUT"

      - name: Commit and push changed feed files, docs/status.json, and data/changes.jsonl
        run: |
          git add docs/*.ics docs/index.html docs/status.json data/changes.jsonl
          if git diff --cached --quiet; then
            echo "No changes to docs/*.ics, docs/index.html, docs/status.json, or data/changes.jsonl"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ -s "${{ runner.temp }}/commit_msg.txt" ]; then
              git commit -F "${{ runner.temp }}/commit_msg.txt"
            else
              git commit -m "chore: update market calendars and status"
            fi
            git pull --rebase
            git push
          fi

      - name: Open GitHub issue for date changes or removals (deduplicated)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const alertPath = `${process.env.RUNNER_TEMP}/calendar_alert.json`;
            if (!fs.existsSync(alertPath)) {
              core.info("No date changes or removals in this run; skipping issue creation.");
              return;
            }
            const payload = JSON.parse(fs.readFileSync(alertPath, "utf8"));
            const { owner, repo } = context.repo;

            const existingIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "all", per_page: 100 }
            );

            const reportedDigests = new Set();
            const reportedKeys = new Set();
            for (const issue of existingIssues) {
              if (!issue.body) continue;
              const digestMatch = issue.body.match(/<!-- calendar-changes-id: ([^\s]+) -->/);
              if (digestMatch) reportedDigests.add(digestMatch[1]);
              for (const m of issue.body.matchAll(/<!-- change-key: ([^>]+) -->/g)) {
                reportedKeys.add(m[1].trim());
              }
            }

            if (reportedDigests.has(payload.digest)) {
              core.info(`Change digest ${payload.digest} already reported; skipping.`);
              return;
            }

            const freshItems = payload.items.filter((it) => !reportedKeys.has(it.alert_key));
            if (freshItems.length === 0) {
              core.info("All date changes/removals in this run were already reported in prior issues.");
              return;
            }

            const moved = freshItems.filter((it) => it.change_type === "date_changed");
            const removed = freshItems.filter((it) => it.change_type === "removed");
            const titleParts = [];
            if (moved.length) titleParts.push(`${moved.length} date change${moved.length === 1 ? "" : "s"}`);
            if (removed.length) titleParts.push(`${removed.length} removal${removed.length === 1 ? "" : "s"}`);
            const title = `Calendar alert (${payload.run_date}): ${titleParts.join(", ")}`;

            const lines = [
              `<!-- calendar-changes-id: ${payload.digest} -->`,
              `# Calendar Changes Detected (${payload.run_date})`,
              "",
            ];
            if (moved.length) {
              lines.push("## Date Changes", "", "| Market | Ticker | Old Date | New Date | Event |", "| --- | --- | --- | --- | --- |");
              moved.forEach((it) => lines.push(it.line));
              lines.push("");
            }
            if (removed.length) {
              lines.push("## Removed Future Events", "", "| Market | Ticker | Previous Date | Event |", "| --- | --- | --- | --- |");
              removed.forEach((it) => lines.push(it.line));
              lines.push("");
            }
            freshItems.forEach((it) => lines.push(`<!-- change-key: ${it.alert_key} -->`));

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body: lines.join("\n") + "\n",
            });
            core.info(`Created calendar alert issue: ${title}`);

      - name: Sync stale-data GitHub issues from docs/status.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const statusPath = "docs/status.json";
            if (!fs.existsSync(statusPath)) return;
            const status = JSON.parse(fs.readFileSync(statusPath, "utf8"));
            const { owner, repo } = context.repo;

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open", per_page: 100 }
            );
            const openByTitle = new Map(openIssues.map((iss) => [iss.title, iss]));

            const targets = Object.entries(status.markets || {}).map(([name, info]) => ({
              name,
              kind: "market",
              info,
            }));
            if (status.sources && status.sources.seonet) {
              targets.push({ name: "seonet", kind: "source", info: status.sources.seonet });
            }

            for (const target of targets) {
              const title = `Stale data: ${target.name}`;
              const existing = openByTitle.get(title);
              const entry = target.info || {};

              if (entry.stale) {
                const lines = [
                  `# Stale Data Alert: \`${target.name}\``,
                  "",
                  `- **Last Successful Update:** ${entry.last_success_at || "Never"}`,
                  `- **Age (days):** ${entry.age_days ?? "Unknown"} (max allowed: ${entry.max_age_days})`,
                ];
                if (target.kind === "market") {
                  lines.push(`- **Upcoming Events:** ${entry.upcoming_events} (minimum required: ${entry.min_upcoming_events})`);
                }
                lines.push("", "## Errors");
                const errs = entry.errors && entry.errors.length ? entry.errors : ["Staleness threshold exceeded."];
                errs.forEach((e) => lines.push(`- ${e}`));
                const body = lines.join("\n") + "\n";

                if (existing) {
                  if ((existing.body || "").trim() !== body.trim()) {
                    await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
                    core.info(`Updated issue #${existing.number}: ${title}`);
                  }
                } else {
                  await github.rest.issues.create({ owner, repo, title, body });
                  core.info(`Opened stale-data issue: ${title}`);
                }
              } else if (entry.healthy && existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `Resolved: \`${target.name}\` is healthy again as of ${entry.last_success_at}. Closing automatically.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: "closed",
                });
                core.info(`Closed recovered stale-data issue #${existing.number}: ${title}`);
              }
            }

      - name: Fail job if any market update failed
        if: steps.build.outputs.cal_exit != '0'
        run: |
          echo "Calendar update exited with status ${{ steps.build.outputs.cal_exit }}"
          exit ${{ steps.build.outputs.cal_exit }}
