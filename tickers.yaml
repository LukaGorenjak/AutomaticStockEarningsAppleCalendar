# Local timezone used when displaying converted event times
display_timezone: Europe/Ljubljana

# Staleness & minimum upcoming event thresholds (make silent failures visible)
thresholds:
  max_age_days: 3
  min_upcoming_events: 1
  sources:
    api:
      max_age_days: 3
    seonet:
      max_age_days: 8
  markets:
    us:
      max_age_days: 3
      min_upcoming_events: 1
    ljse:
      max_age_days: 3
      min_upcoming_events: 1
    macro:
      max_age_days: 3
      min_upcoming_events: 1

# Per-market watchlists and configuration
us:
  tickers:
    - AAPL
    - MSFT
    - NVDA
    - GOOGL
    - AMZN
    - META
    - TSLA
  manual_events:
    - ticker: ASML
      date: "2027-01-27"
      note: "Q4 2026 earnings release (manual entry)"
    - ticker: TSM
      date: "2027-01-14"
      note: "Q4 2026 earnings release"

ljse:
  tickers:
    - KRKG
    - CICG
    - TLSG
    - LKPG
  events_file: ljse_events.yaml
  issuers:
    KRKG: "KRKA, d. d., Novo mesto"
    CICG: "CINKARNA CELJE, d.d., Celje"
    TLSG: "TELEKOM SLOVENIJE, d.d., Ljubljana"
    LKPG: "LUKA KOPER, d.d., Koper"
    NLBR: "NLB, d. d., Ljubljana"

macro:
  series:
    - ecb
    - fomc
    - us_cpi
    - ea_hicp
  events_file: data/macro_events.yaml
