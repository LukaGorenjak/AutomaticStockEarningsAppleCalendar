# Official Macroeconomic Schedules (2026-2027)
#
# Covered series (configurable via `macro.series` in `tickers.yaml`):
# - `fomc`: Federal Reserve FOMC monetary policy meetings (`central_bank_meeting`)
#   Official schedule: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#   Multi-day all-day meetings; policy statement released on Day 2 at 14:00 America/New_York.
# - `ecb`: European Central Bank Governing Council monetary policy meetings (`central_bank_meeting`)
#   Official schedule: https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html
#   Multi-day all-day meetings in Frankfurt; monetary policy decision released on Day 2 at 14:15 Europe/Berlin.
# - `us_cpi`: U.S. Bureau of Labor Statistics Consumer Price Index releases (`inflation_release`)
#   Official schedule: https://www.bls.gov/schedule/news_release/cpi.htm
#   Timed releases at 08:30 America/New_York.
# - `ea_hicp`: Eurostat Euro-area annual inflation flash estimate (HICP) releases (`inflation_release`)
#   Official schedule: https://ec.europa.eu/eurostat/web/main/news/release-calendar
#   Timed releases at 11:00 Europe/Brussels.

macro_events:
